<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán - NAWHOBBY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --gundam-blue: #1e40af;
            --gundam-red: #dc2626;
            --card-bg: #f8fafc;
            --border-color: #e2e8f0;
            --shadow-color: rgba(0,0,0,0.1);
            --text-color: #1e293b;
        }
        .checkout-section { padding: 40px 0; background: var(--card-bg); }
        .checkout-title { color: var(--text-color); font-weight: bold; margin-bottom: 30px; }
        
        /* Cấu trúc Card */
        .cart-summary-card { 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }
        .card-header { padding: 15px 20px; border-bottom: none; }
        
        .item-row { border-bottom: 1px solid var(--border-color); }
        .item-row:last-child { border-bottom: none; }
        .item-img { width: 60px; height: 60px; object-fit: contain; background: white; border-radius: 8px; border: 1px solid #eee; }
        
        .total-highlight { background: linear-gradient(135deg, var(--gundam-blue), #3b82f6); color: white; border-radius: 12px; padding: 20px; }
        
        .btn-checkout { background: var(--gundam-red); border: none; font-weight: bold; text-transform: uppercase; padding: 15px; border-radius: 8px; color: white;}
        .btn-checkout:hover { background: #b91c1c; transform: translateY(-2px); color: white;}
        .form-control:focus { border-color: var(--gundam-blue); box-shadow: 0 0 0 0.2rem rgba(30,64,175,0.25); }

        /* Payment Methods Styles */
        .payment-option { position: relative; }
        .payment-radio { display: none; }
        .payment-label { cursor: pointer; display: block; margin: 0; }
        
        .compact-card {
            display: flex; align-items: center; padding: 12px;
            border: 2px solid var(--border-color); border-radius: 10px;
            background: white; transition: all 0.2s ease;
        }
        .compact-card:hover { border-color: #93c5fd; }
        
        .payment-radio:checked + .payment-label .compact-card {
            border-color: var(--gundam-blue);
            background: #f0fdf4;
            box-shadow: 0 4px 12px rgba(30,64,175,0.1);
        }

        .payment-icon-small {
            width: 36px; height: 36px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 16px; margin-right: 12px; flex-shrink: 0;
            background: linear-gradient(135deg, var(--gundam-blue), #3b82f6);
        }
        .payment-info h6 { margin: 0; color: var(--text-color); font-weight: 600; font-size: 0.95rem; }
        .payment-info p { margin: 2px 0 0 0; color: #64748b; font-size: 0.8rem; }
        
        #checkout-summary::-webkit-scrollbar { width: 6px; }
        #checkout-summary::-webkit-scrollbar-track { background: #f1f1f1; }
        #checkout-summary::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #checkout-summary::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Style bổ sung cho Sổ địa chỉ */
        #api-address-container { margin-bottom: 15px; }
        .cursor-pointer { cursor: pointer; }
    </style>
</head>
<body>

<div id="header-container"></div>

    <section class="checkout-section">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <h2 class="checkout-title">Thanh toán - NawHobby</h2>
                </div>
            </div>

            <div class="row align-items-start g-4">
                
                <div class="col-lg-4">
                    <div class="card cart-summary-card d-flex flex-column">
                        <div class="card-header text-white" style="background-color: #2563eb;">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-shopping-cart me-2"></i>Giỏ hàng & Tổng tiền</h5>
                        </div>
                        <div class="card-body p-0 d-flex flex-column">
                            <div id="checkout-summary" class="overflow-auto" style="max-height: 300px; padding: 10px;">
                                <div id="checkout-items"></div>
                            </div>
                            <div id="emptyCartMessage" class="p-4 text-center text-muted d-none">
                                <i class="fas fa-shopping-cart fa-3x mb-3"></i>
                                <h5>Giỏ hàng trống</h5>
                                <a href="cart.html" class="btn btn-primary btn-sm mt-2">Quay lại giỏ hàng</a>
                            </div>
                            <div class="total-highlight m-3 mt-3">
                                <div class="d-flex justify-content-between mb-2">
                                    <span>Tạm tính:</span><span id="subtotal">0 ₫</span>
                                </div>
                                <div class="d-flex justify-content-between mb-3">
                                    <span>Phí vận chuyển:</span><span id="shippingFee" class="text-success fw-bold">Miễn phí</span>
                                </div>
                                <hr class="text-white-50 my-2">
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <h4 class="mb-0 fs-5">Tổng tiền:</h4>
                                    <h3 class="mb-0 fw-bold fs-4" id="total-amount">0 ₫</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card cart-summary-card">
                        <div class="card-header text-white" style="background-color: #16a34a;">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-info-circle me-2"></i>Thông tin nhận hàng</h5>
                        </div>
                        <div class="card-body p-4">
                            <div id="api-address-container"></div>

                            <form id="checkoutForm">
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark">Họ và tên <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control bg-light" id="fullName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark">Số điện thoại <span class="text-danger">*</span></label>
                                    <input type="tel" class="form-control bg-light" id="phoneNumber" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label fw-bold text-dark">Địa chỉ giao hàng <span class="text-danger">*</span></label>
                                    <div class="row g-2">
                                        <div class="col-6 mb-2">
                                            <input type="text" class="form-control bg-light form-control-sm" id="province" placeholder="Tỉnh/Thành" required>
                                        </div>
                                        <div class="col-6 mb-2">
                                            <input type="text" class="form-control bg-light form-control-sm" id="district" placeholder="Quận/Huyện" required>
                                        </div>
                                        <div class="col-6">
                                            <input type="text" class="form-control bg-light form-control-sm" id="ward" placeholder="Phường/Xã" required>
                                        </div>
                                        <div class="col-6">
                                            <input type="text" class="form-control bg-light form-control-sm" id="detailedAddress" placeholder="Số nhà, tên đường" required>
                                        </div>
                                    </div>
                                    <input type="hidden" id="shippingAddress">
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card cart-summary-card d-flex flex-column">
                        <div class="card-header text-white" style="background-color: #475569;">
                            <h5 class="mb-0 fw-bold"><i class="fas fa-credit-card me-2"></i>Thanh toán & Đặt hàng</h5>
                        </div>
                        <div class="card-body p-3 d-flex flex-column">
                            
                            <div class="row g-2 mb-3">
                                <div class="col-6 payment-option">
                                    <input type="radio" name="paymentMethod" id="cod" value="COD" class="payment-radio" checked form="checkoutForm" required>
                                    <label for="cod" class="payment-label w-100 h-100">
                                        <div class="compact-card h-100">
                                            <div class="payment-icon-small"><i class="fas fa-truck"></i></div>
                                            <div class="payment-info">
                                                <h6>COD</h6>
                                                <p>Tiền mặt</p>
                                            </div>
                                        </div>
                                    </label>
                                </div>

                                <div class="col-6 payment-option">
                                    <input type="radio" name="paymentMethod" id="bank" value="BANK" class="payment-radio" form="checkoutForm" required>
                                    <label for="bank" class="payment-label w-100 h-100">
                                        <div class="compact-card h-100">
                                            <div class="payment-icon-small" style="background: linear-gradient(135deg, #10b981, #059669);"><i class="fas fa-qrcode"></i></div>
                                            <div class="payment-info">
                                                <h6>BANK</h6>
                                                <p>Quét QR</p>
                                            </div>
                                        </div>
                                    </label>
                                </div>

                                <div class="col-12 payment-option">
                                    <input type="radio" name="paymentMethod" id="momo" value="MOMO" class="payment-radio" form="checkoutForm" required>
                                    <label for="momo" class="payment-label w-100">
                                        <div class="compact-card">
                                            <div class="payment-icon-small" style="background: linear-gradient(135deg, #ec4899, #db2777);"><i class="fas fa-wallet"></i></div>
                                            <div class="payment-info d-flex align-items-center gap-2">
                                                <h6>MOMO</h6>
                                                <p class="mb-0">- Thanh toán qua ví điện tử</p>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div id="qrCodeContainer" class="text-center d-none mb-3 p-3 border rounded bg-white shadow-sm">
    <p class="fw-bold text-primary mb-2">Quét mã để thanh toán <span id="display-total">0</span> ₫</p>
    
    <img id="sepay-qr-img" src="" alt="VietQR Payment" class="img-fluid mb-2" style="max-width: 200px; border: 1px solid #eee;">
    
    <div class="text-start small bg-light p-2 rounded">
        <p class="mb-1"><strong>Nội dung:</strong> <span id="display-order-code" class="text-danger fw-bold"></span></p>
        <p class="mb-0"><strong>Chủ TK:</strong> QUANG DUNG NAM</p>
    </div>
    
    <div class="mt-2 d-flex align-items-center justify-content-center gap-2">
        <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
        <span class="small text-muted">Đang chờ thanh toán...</span>
    </div>
</div>
                            <button type="submit" form="checkoutForm" class="btn btn-checkout w-100 mt-3" id="placeOrderBtn">
                                <i class="fas fa-check me-2"></i>ĐẶT HÀNG NGAY
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/checkout.js"></script>
    <script>
    // Đảm bảo trang Checkout luôn tuân thủ luật "Click mới hiện" của NawHobby
    document.addEventListener('DOMContentLoaded', () => {
        // Đợi 500ms để chắc chắn Header đã fetch xong
        setTimeout(() => {
            if (typeof initNawHobbyDropdowns === 'function') {
                initNawHobbyDropdowns();
            }
        }, 500);
    });
</script>
</body>
</html>
